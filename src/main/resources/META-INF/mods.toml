modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/mochi-753/ClockworkTrials"
logoFile = "logo.png"
credits = """
一部のコードはSakurafuld氏のHyperlinkを利用、改変したものです
音源はオトロジック(CC BY 4.0)からお借りしました
"""
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "geckolib"
mandatory = true
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"